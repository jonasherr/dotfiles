onboarding = false
# Herdr configuration adapted from ~/.config/kitty/kitty.conf.
# Herdr owns the persistent agent processes; Kitty is only the client.

[theme]
name = "terminal"

auto_switch = false

[theme.custom]
# The terminal theme highlights rows with color8, which hides the sidebar text.
# Use darker Everforest backgrounds so the selected agent stays readable.
active_row_bg = "#475258"
selection_bg = "#505a60"

[terminal]
shell_mode = "login"
new_cwd = "follow"

[keys]
# Herdr uses Ctrl+B. Kitty's session mode uses Ctrl+Shift+B instead.
prefix = "ctrl+b"

# Workspace/session management.
workspace_picker = "prefix+w"
goto = "prefix+g"
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
# prefix+shift+d removes the active worktree through the CLI (see keys.command below).
close_workspace = ""
# prefix+shift+g creates a worktree through the CLI without blocking (see keys.command below).
new_worktree = ""
# Workspace switching is handled through workspace_picker (prefix+w), or directly with
# Ctrl+B, Shift+1..9 for the first nine workspaces.
switch_workspace = "prefix+shift+1..9"

# Kitty's session shortcuts become workspace picker/navigation shortcuts.
# Use prefix+w, then select: dotfiles, notes, agents, customers, writing, etc.
# Pane navigation keeps the existing Ctrl+H/J/K/L muscle memory.

# Tabs.
new_tab = "prefix+c"
rename_tab = "prefix+shift+t"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
close_tab = "prefix+shift+x"

# Direct Vim-style pane navigation, including Ctrl+J for down.
# Direct bindings are implemented by the custom navigator commands below.
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
split_vertical = "cmd+enter"
split_horizontal = "prefix+minus"
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+r"

# Herdr equivalents for the useful Kitty controls.
detach = "prefix+q"
toggle_sidebar = "prefix+b"
open_notification_target = "prefix+o"
edit_scrollback = "prefix+e"
reload_config = "prefix+shift+r"
help = "prefix+?"

# Vim-style movement while the workspace/navigation picker is open.
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_left = "h"
navigate_pane_right = "l"

[[keys.command]]
key = "ctrl+h"
command = """p=$(/bin/realpath -q "$HOME/.config/herdr/config.toml") || exit 1; case "$p" in */herdr/config.toml) repo=${p%/herdr/config.toml} ;; *) exit 1 ;; esac; exec "$repo/bin/herdr-navigator" left"""
type = "shell"
description = "Navigate left in Neovim or Herdr"

[[keys.command]]
key = "ctrl+j"
command = """p=$(/bin/realpath -q "$HOME/.config/herdr/config.toml") || exit 1; case "$p" in */herdr/config.toml) repo=${p%/herdr/config.toml} ;; *) exit 1 ;; esac; exec "$repo/bin/herdr-navigator" down"""
type = "shell"
description = "Navigate down in Neovim or Herdr"

[[keys.command]]
key = "ctrl+k"
command = """p=$(/bin/realpath -q "$HOME/.config/herdr/config.toml") || exit 1; case "$p" in */herdr/config.toml) repo=${p%/herdr/config.toml} ;; *) exit 1 ;; esac; exec "$repo/bin/herdr-navigator" up"""
type = "shell"
description = "Navigate up in Neovim or Herdr"

[[keys.command]]
key = "ctrl+l"
command = """p=$(/bin/realpath -q "$HOME/.config/herdr/config.toml") || exit 1; case "$p" in */herdr/config.toml) repo=${p%/herdr/config.toml} ;; *) exit 1 ;; esac; exec "$repo/bin/herdr-navigator" right"""
type = "shell"
description = "Navigate right in Neovim or Herdr"

[[keys.command]]
key = "prefix+shift+d"
command = """p=$(/bin/realpath -q "$HOME/.config/herdr/config.toml") || exit 1; case "$p" in */herdr/config.toml) repo=${p%/herdr/config.toml} ;; *) exit 1 ;; esac; exec "$repo/bin/herdr-remove-worktree\""""
type = "shell"
description = "Remove the active worktree checkout in the background"

[[keys.command]]
key = "prefix+shift+g"
command = """p=$(/bin/realpath -q "$HOME/.config/herdr/config.toml") || exit 1; case "$p" in */herdr/config.toml) repo=${p%/herdr/config.toml} ;; *) exit 1 ;; esac; exec "$repo/bin/herdr-create-worktree\""""
type = "popup"
description = "Create a worktree from the active workspace in the background"

[ui]
tab_bar_position = "bottom"
sidebar_start_collapsed = false
sidebar_collapsed_mode = "hidden"
hide_tab_bar_when_single_tab = false
pane_borders = true
pane_outer_borders = true
pane_gaps = true

agent_panel_sort = "priority"
status_indicators = "symbols"

[ui.sidebar.agents]
# Lead with the agent session title instead of the workspace name.
# Workspace and tab move to a dimmed second line for context.
rows = [
  ["state_icon", { token = "terminal_title_stripped", bold = true }],
  [{ token = "workspace", dim = true }, { token = "tab", dim = true }],
]

[ui.sidebar.spaces]
# Default Space rows plus the worktree spinners: $creating from
# bin/herdr-create-worktree and $removing from bin/herdr-remove-worktree.
rows = [
  [
    "state_icon",
    "workspace",
    { token = "$creating", fg = "#a7c080" },
    { token = "$removing", fg = "#e69875" },
  ],
  ["branch", "git_status"],
]

[session]
# Restore supported Pi integrations after a Herdr server restart.
resume_agents_on_restore = true

[update]
channel = "stable"
version_check = true
manifest_check = true

[experimental]
# Forward Kitty graphics escapes for image previews in Yazi.
kitty_graphics = true
# Preserve recent pane screen history across Herdr server restarts.
pane_history = true

[ui.toast]
# Show Herdr notifications through the macOS notification system.
delivery = "system"
delay_seconds = 1

[ui.sound]
# Play the request sound when an agent becomes blocked.
enabled = true

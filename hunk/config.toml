# Match the Everforest Dark Soft theme used by Kitty.
theme = "custom"
mode = "auto"
line_numbers = true

[custom_theme]
base = "github-dark-default"
label = "Everforest Dark Soft"
background = "#333c43"
panel = "#3a464c"
panelAlt = "#434f55"
border = "#5d6b66"
accent = "#7fbbb3"
accentMuted = "#83c092"
text = "#d3c6aa"
muted = "#9da9a0"
addedBg = "#3e5145"
removedBg = "#5a4146"
movedAddedBg = "#41524b"
movedRemovedBg = "#57464d"
contextBg = "#333c43"
addedContentBg = "#4b624f"
removedContentBg = "#6a484d"
contextContentBg = "#333c43"
addedSignColor = "#a7c080"
removedSignColor = "#e67e80"
lineNumberBg = "#333c43"
lineNumberFg = "#859289"
selectedHunk = "#4a5c5b"
badgeAdded = "#a7c080"
badgeRemoved = "#e67e80"
badgeNeutral = "#dbbc7f"
fileNew = "#a7c080"
fileDeleted = "#e67e80"
fileRenamed = "#7fbbb3"
fileModified = "#dbbc7f"
fileUntracked = "#83c092"
noteBorder = "#d699b6"
noteBackground = "#434f55"
noteTitleBackground = "#505a60"
noteTitleText = "#d3c6aa"

[custom_theme.syntax]
default = "#d3c6aa"
keyword = "#d699b6"
string = "#a7c080"
comment = "#859289"
number = "#e69875"
function = "#7fbbb3"
property = "#83c092"
type = "#dbbc7f"
variable = "#d3c6aa"
operator = "#7fbbb3"
punctuation = "#9da9a0"

# BEGIN_KITTY_THEME
# Everforest Dark Soft
include current-theme.conf
# END_KITTY_THEME
# reload: ctrl + cmd + ,

# BEGIN_KITTY_FONTS
font_family      family='GeistMono Nerd Font Mono' postscript_name=GeistMonoNFM-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# for normal use
font_size 18.0

# for screen sharing
# font_size 26.0

#: Scrollback {{{

scrollback_lines 2000

#: Number of lines of history to keep in memory for scrolling back.
#: Memory is allocated on demand. Negative numbers are (effectively)
#: infinite scrollback. Note that using very large scrollback is not
#: recommended as it can slow down performance of the terminal and
#: also use large amounts of RAM. Instead, consider using
#: scrollback_pager_history_size. Note that on config reload if this
#: is changed it will only affect newly created windows, not existing
#: ones.

scrollback_pager nvim -c "autocmd VimLeave * silent ! rm -f /tmp/kitty_scrollback_buffer" -c "silent write! /tmp/kitty_scrollback_buffer | te cat /tmp/kitty_scrollback_buffer - "

#: Program with which to view scrollback in a new window. The
#: scrollback buffer is passed as STDIN to this program. If you change
#: it, make sure the program you use can handle ANSI escape sequences
#: for colors and text formatting. INPUT_LINE_NUMBER in the command
#: line above will be replaced by an integer representing which line
#: should be at the top of the screen. Similarly CURSOR_LINE and
#: CURSOR_COLUMN will be replaced by the current cursor position or
#: set to 0 if there is no cursor, for example, when showing the last
#: command output.

#: Tab bar {{{

tab_bar_edge bottom

#: The edge to show the tab bar on, top or bottom.

tab_bar_style powerline

#: The tab bar style, can be one of:

#: fade
#:     Each tab's edges fade into the background color. (See also tab_fade)
#: slant
#:     Tabs look like the tabs in a physical file.
#: separator
#:     Tabs are separated by a configurable separator. (See also
#:     tab_separator)
#: powerline
#:     Tabs are shown as a continuous line with "fancy" separators.
#:     (See also tab_powerline_style)
#: custom
#:     A user-supplied Python function called draw_tab is loaded from the file
#:     tab_bar.py in the kitty config directory. For examples of how to
#:     write such a function, see the functions named draw_tab_with_* in
#:     kitty's source code: kitty/tab_bar.py. See also
#:     this discussion <https://github.com/kovidgoyal/kitty/discussions/4447>
#:     for examples from kitty users.
#: hidden
#:     The tab bar is hidden. If you use this, you might want to create
#:     a mapping for the select_tab action which presents you with a list of
#:     tabs and allows for easy switching to a tab.

tab_powerline_style round

#: The powerline separator style between tabs in the tab bar when
#: using powerline as the tab_bar_style, can be one of: angled,
#: slanted, round.

tab_title_template "{index}: {fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title[title.rfind('/')+1:]}"

#: A template to render the tab title. The default just renders the
#: title with optional symbols for bell and activity. If you wish to
#: include the tab-index as well, use something like: {index}:{title}.
#: Useful if you have shortcuts mapped for goto_tab N. If you prefer
#: to see the index as a superscript, use {sup.index}. All data
#: available is:

tab_bar_filter session:~ or session:^$

#: Filter tabs shown in the tab bar. Only tabs matching the filter are shown.

#: title
#:     The current tab title.
#: index
#:     The tab index usable with goto_tab N goto_tab shortcuts.
#: layout_name
#:     The current layout name.
#: num_windows
#:     The number of windows in the tab.
#: num_window_groups
#:     The number of window groups (a window group is a window and all of its overlay windows) in the tab.
#: tab.active_wd
#:     The working directory of the currently active window in the tab
#:     (expensive, requires syscall). Use active_oldest_wd to get
#:     the directory of the oldest foreground process rather than the newest.
#: tab.active_exe
#:     The name of the executable running in the foreground of the currently
#:     active window in the tab (expensive, requires syscall). Use
#:     active_oldest_exe for the oldest foreground process.
#: max_title_length
#:     The maximum title length available.
#: keyboard_mode
#:     The name of the current keyboard mode <https://sw.kovidgoyal.net/kitty/mapping/#modal-mappings> or the empty string if no keyboard mode is active.
# active_tab_foreground   #000
# active_tab_background   #BC93F9
# active_tab_font_style   bold-italic
# inactive_tab_foreground #444
# inactive_tab_background #454759
# inactive_tab_font_style normal

#: Tab bar colors and styles.
# tab_bar_background #454759

hide_window_decorations yes

window_padding_height 16

#: Hide the window decorations (title-bar and window borders) with
#: yes. On macOS, titlebar-only and titlebar-and-corners can be used
#: to only hide the titlebar and the rounded corners. Whether this
#: works and exactly what effect it has depends on the window
#: manager/operating system. Note that the effects of changing this
#: option when reloading config are undefined. When using titlebar-
#: only, it is useful to also set window_margin_width and
#: placement_strategy to prevent the rounded corners from clipping
#: text. Or use titlebar-and-corners.

#: Advanced {{{

# shell .
shell zsh --login

#: The shell program to execute. The default value of . means to use
#: the value of of the SHELL environment variable or if unset,
#: whatever shell is set as the default shell for the current user.
#: Note that on macOS if you change this, you might need to add
#: --login and --interactive to ensure that the shell starts in
#: interactive mode and reads its startup rc files. Environment
#: variables are expanded in this setting.

# use it for raycast plugin to open notes
# allow_remote_control yes

#: Allow other programs to control kitty. If you turn this on, other
#: programs can control all aspects of kitty, including sending text
#: to kitty windows, opening new windows, closing windows, reading the
#: content of windows, etc. Note that this even works over SSH
#: connections. The default setting of no prevents any form of remote
#: control. The meaning of the various values are:

# listen_on none
# listen_on unix:/tmp/mykitty
# needed for Vim Kitty Navigator
allow_remote_control yes
listen_on unix:/tmp/mykitty

#: Listen to the specified socket for remote control connections. Note
#: that this will apply to all kitty instances. It can be overridden
#: by the kitty --listen-on command line option. For UNIX sockets,
#: such as unix:${TEMP}/mykitty or unix:@mykitty (on Linux).
#: Environment variables are expanded and relative paths are resolved
#: with respect to the temporary directory. If {kitty_pid} is present,
#: then it is replaced by the PID of the kitty process, otherwise the
#: PID of the kitty process is appended to the value, with a hyphen.
#: For TCP sockets such as tcp:localhost:0 a random port is always
#: used even if a non-zero port number is specified.  See the help for
#: kitty --listen-on for more details. Note that this will be ignored
#: unless allow_remote_control is set to either: yes, socket or
#: socket-only. Changing this option by reloading the config is not
#: supported.

shell_integration enabled

#: Enable shell integration on supported shells. This enables features
#: such as jumping to previous prompts, browsing the output of the
#: previous command in a pager, etc. on supported shells. Set to
#: disabled to turn off shell integration, completely. It is also
#: possible to disable individual features, set to a space separated
#: list of these values: no-rc, no-cursor, no-title, no-cwd, no-
#: prompt-mark, no-complete, no-sudo. See Shell integration
#: <https://sw.kovidgoyal.net/kitty/shell-integration/> for details.

#: The full list of actions that can be mapped to key presses is
#: available here <https://sw.kovidgoyal.net/kitty/actions/>.

kitty_mod ctrl+shift

#: Special modifier key alias for default shortcuts. You can change
#: the value of this option to alter all default shortcuts that use
#: kitty_mod.

clear_all_shortcuts yes

#: Remove all shortcut definitions up to this point. Useful, for
#: instance, to remove the default shortcuts.

#: Clipboard {{{

#: Copy to clipboard

# map kitty_mod+c copy_to_clipboard
map cmd+c       copy_to_clipboard

#::  There is also a copy_or_interrupt action that can be optionally
#::  mapped to Ctrl+C. It will copy only if there is a selection and
#::  send an interrupt otherwise. Similarly,
#::  copy_and_clear_or_interrupt will copy and clear the selection or
#::  send an interrupt if there is no selection.

#: Paste from clipboard

# map kitty_mod+v paste_from_clipboard
map cmd+v       paste_from_clipboard

#: Browse scrollback buffer in pager

map kitty_mod+o show_scrollback

#::  You can pipe the contents of the current screen and history
#::  buffer as STDIN to an arbitrary program using launch --stdin-
#::  source. For example, the following opens the scrollback buffer in
#::  less in an overlay window::

#: Window management {{{

#: New window

map cmd+enter       new_window_with_cwd

#: Close window

map kitty_mod+w close_window

# Config from vim-kitty-navigator

map ctrl+j kitten pass_keys.py bottom ctrl+j
map ctrl+k kitten pass_keys.py top    ctrl+k
map ctrl+h kitten pass_keys.py left   ctrl+h
map ctrl+l kitten pass_keys.py right  ctrl+l

#: Start resizing window

map kitty_mod+r start_resizing_window
# map cmd+r       start_resizing_window

#: Next tab (also reset focused tab color for opencode attention indicator)
map kitty_mod+l combine | next_tab | kitten meow/reset_tab_color.py
map control+tab combine | next_tab | kitten meow/reset_tab_color.py

#: Previous tab (also reset focused tab color for opencode attention indicator)
map kitty_mod+h combine | previous_tab | kitten meow/reset_tab_color.py
map control+shift+tab combine | previous_tab | kitten meow/reset_tab_color.py

#: Next window
# map control+tab next_window

#: Previous window
# map control+shift+tab previous_window

#: New tab
map cmd+t       launch --type=tab --cwd=current --add-to-session=.

#: New tab
map cmd+n       new_os_window

#: Close tab
map cmd+w       close_tab


#: Set tab title
map cmd+.           kitten meow/set_tab_title.py


#: Layout management {{{
map --new-mode ml super+shift+l

map --mode ml z toggle_layout stack
#: Next layout
map --mode ml j next_layout
#: Similarly, to switch back to the previous layout::
map --mode ml k last_used_layout

map --mode ml esc pop_keyboard_mode

#: stack layout::
map kitty_mod+z toggle_layout stack
#: }}}

#: Session management {{{
map --new-mode session ctrl+b

map --mode session esc pop_keyboard_mode
map --mode session d combine | pop_keyboard_mode | goto_session ~/Projects/dotfiles/kitty/sessions/dotfiles.kitty-session
map --mode session n combine | pop_keyboard_mode | goto_session ~/Projects/dotfiles/kitty/sessions/notes.kitty-session
map --mode session h combine | pop_keyboard_mode | goto_session ~/Projects/dotfiles/kitty/sessions/agent-help.kitty-session
map --mode session r combine | pop_keyboard_mode | goto_session ~/Projects/dotfiles/kitty/sessions/daily-report.kitty-session
map --mode session w combine | pop_keyboard_mode | goto_session ~/Projects/dotfiles/kitty/sessions/writing.kitty-session
map --mode session v combine | pop_keyboard_mode | goto_session ~/Projects/dotfiles/kitty/sessions/vercel-internal-agents.kitty-session
map --mode session l combine | pop_keyboard_mode | kitten meow/session_switcher.py --previous
map --mode session s combine | pop_keyboard_mode | save_as_session --base-dir ~/.config/kitty/sessions --use-foreground-process --relocatable
map --mode session x combine | pop_keyboard_mode | close_session .
map --mode session a combine | pop_keyboard_mode | launch --type=overlay --title "new session" /bin/bash -lc "$HOME/.config/kitty/meow/new-session.sh"
map --mode session tab combine | pop_keyboard_mode | goto_layout splits | launch --location=hsplit --bias=40 python3 ~/.config/kitty/meow/session_switcher.py
map --mode session p combine | pop_keyboard_mode | kitten meow/toggle_sidebar.py
map --mode session u combine | pop_keyboard_mode | kitten meow/jump_notification.py
#: }}}

#: Font sizes {{{
map --new-mode font-size super+shift+r
map --mode font-size esc pop_keyboard_mode

#: Increase font size
map --mode font-size j change_font_size all +2.0

#: Decrease font size
map --mode font-size k change_font_size all -2.0

#: Reset font size
# map option+shift+r        change_font_size all 0
map --mode font-size r change_font_size all 0
#: }}}

#: Open URL
map kitty_mod+e open_url_with_hints

#: Open selected path
map kitty_mod+p>y kitten hints --type path


#: Edit config file
map cmd+,        edit_config_file

#: Open the kitty command shell
map kitty_mod+escape kitty_shell window


#: Reload kitty.conf
map ctrl+cmd+,   load_config_file


#: Quit kitty
map cmd+q quit


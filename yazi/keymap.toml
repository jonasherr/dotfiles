[[mgr.prepend_keymap]]
on   = [ "g", "p" ]
run  = "cd ~/Projects"
desc = "Cd to ~/Projects"

[[mgr.prepend_keymap]]
on   = [ "g", "c" ]
run  = "cd ~/Projects/dotfiles"
desc = "Cd to ~/Projects/dotfiles"

[[mgr.prepend_keymap]]
on   = [ "g", "v" ]
run  = "cd ~/Projects/dotfiles/nvim"
desc = "Cd to ~/Projects/dotfiles/nvim"

[[mgr.prepend_keymap]]
on   = [ "g", "n" ]
run  = "cd ~/Library/'Mobile Documents'/iCloud~md~obsidian/Documents/Notes"
desc = "Cd to notes"

[[mgr.prepend_keymap]]
on   = [ "g", "i" ]
run  = "cd ~/Library/'Mobile Documents'/com~apple~CloudDocs"
desc = "Cd to ~/Library/'Mobile Documents'/com~apple~CloudDocs"

[[mgr.prepend_keymap]]
on   = [ "g", "?" ]
run  = "help"
desc = "Open help"

[[mgr.prepend_keymap]]
on = "<C-p>"
run = '''
  shell --confirm 'qlmanage -p "$@"'
'''
desc = "Show file with system quicklook."

[[mgr.prepend_keymap]]
on   = [ "g", "f" ]
run  = "shell 'open -R \"$@\"'"
desc = "Reveal in Finder"

[[mgr.prepend_keymap]]
on = "Y"
run = '''
  shell --confirm 'for f in "$@"; do osascript -e "set the clipboard to (POSIX file \"$f\")"; done && echo "Copied to clipboard"'
'''
desc = "Copy file to clipboard"

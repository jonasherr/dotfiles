[metadata]
name = "brew-packages"
description = "List and manage Homebrew packages (installed)"
requirements = ["brew"]

[source]
command = [
  "brew list --formula",
  "brew list --cask",
]

[preview]
command = "brew info '{}'"

[ui]
layout = "portrait"

[keybindings]
ctrl-d = "actions:uninstall"

[actions.upgrade]
description = "Upgrade the selected package"
command = "brew upgrade '{}'"
mode = "execute"

[actions.uninstall]
description = "Uninstall the selected package"
command = "brew uninstall '{}'"
mode = "execute"

[actions.homepage]
description = "Open the package homepage in browser"
command = "brew home '{}'"
mode = "fork"

[actions.pin]
description = "Pin the package (prevent upgrades)"
command = "brew pin '{}'"
mode = "fork"

[actions.unpin]
description = "Unpin the package (allow upgrades)"
command = "brew unpin '{}'"
mode = "fork"

[actions.outdated]
description = "Show outdated packages"
command = "brew outdated"
mode = "execute"

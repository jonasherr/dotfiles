[metadata]
name = "dirs"
description = "Browse and select directories"
requirements = ["fd"]

[source]
command = [
  "fd -t d",
  "fd -t d --hidden",
]

[preview]
command = "ls -laG '{}'"

[keybindings]
shortcut = "f2"

[actions.cd]
description = "Open a shell in the selected directory"
command = "cd '{}' && $SHELL"
mode = "execute"

[actions.goto_parent_dir]
description = "Re-opens tv in the parent directory"
command = "tv dirs .."
mode = "execute"

[metadata]
name = "tldr"
description = "Browse TLDR help pages for command-line tools"
requirements = ["tldr"]

[source]
command = "tldr --list 2>/dev/null | sed $'s/\\033\\[[0-9;]*m//g' | grep -v '^Pages' | grep -v '^$'"

[preview]
command = "tldr -C '{}'"

[keybindings]
enter = "actions:open"

[actions.open]
description = "Open the selected TLDR page"
command = "tldr '{}'"
mode = "execute"

[ui]
layout = "portrait"
